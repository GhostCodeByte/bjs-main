[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
(
  /(
      \.git
    | \.venv
    | build
    | dist
    | __pycache__
  )/
)
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "B",  # flake8-bugbear
  "I",  # import sorting
  "UP", # pyupgrade
]
ignore = [
  "E501",  # handled by formatter
]
fix = true
src = ["alles_neu", "admin"]

[tool.ruff.isort]
combine-as-imports = true
known-first-party = ["app", "admin"]
